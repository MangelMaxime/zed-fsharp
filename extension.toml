id = "fsharp"
name = "F#"
description = "F# language support for Zed"
version = "0.0.9"
schema_version = 1
authors = ["Nathan Collins <me@nathancollins.dev>"]
repository = "https://github.com/nathanjcollins/zed-fsharp"

[settings]
fsac_custom_path = { type = "string", optional = true, description = "Custom path to fsautocomplete binary" }
fsac_custom_arguments = { type = "array", items = "string", default = [], description = "Additional arguments for fsautocomplete" }

[language_servers.fsautocomplete]
name = "fsautocomplete"
language = "FSharp"

# Schema defaults to debug_adapter_schemas/netcoredbg.json
[debug_adapters.netcoredbg]

# Converts `dotnet run` tasks into netcoredbg debug scenarios
[debug_locators.dotnet]

[grammars.fsharp]
repository = "https://github.com/MangelMaxime/tree-sitter-fsharp"
commit = "433ada2f621f7f2f28b01d47a9478b6576659cdf"

# `*` matches a single argument; `**` allows any trailing arguments.
# The locator needs multi-argument invocations like `dotnet msbuild <project> -getProperty:TargetPath`.
[[capabilities]]
kind = "process:exec"
command = "dotnet"
args = ["**"]
